<html>
<head>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="custom.js"></script>
	<link type="text/css" rel="stylesheet" href="/portal/resources/style-guide/css/fluig-style-guide.min.css"/>
	<script type="text/javascript" src="/portal/resources/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
</head>
<body>
	<div class="fluig-style-guide">
		<form class="form-horizontal" name="form" role="form">
			<div class="panel-group" id="accordion">
			    <div class="panel panel-default">
			        <div class="panel-heading">
			            <h4 class="panel-title">
			                <a data-toggle="collapse" data-parent="#accordion" href="#collapseOne">
			                Sample - Create Advanced Folder
			                </a>
			            </h4>
			        </div>
			        <div id="collapseOne" class="panel-collapse collapse in">
			            <div class="panel-body">
			            	<div class="row">
				            	<div class="form-group col-sm-12">
							            <div class="col-sm-4">
							                <input type="text" class="form-control" placeholder="Insert folder name" name="txtFolderName" id="txtFolderName">
							            </div>
							            <div class="col-sm-4">
							                <input
											    type="zoom"
											    id = "txtFolderCode"
											    name="txtFolderCode"
											    placeholder="Select parent folder"
											    data-zoom="{
											        'displayKey':'documentId',
											        'datasetId':'document',
											        'fields':[
											            {
											               'field':'documentId',
											               'label':'Código',
											              'standard':'true'
											            },{
											              'field':'documentDescription',
											              'label':'Descrição'
											            }
											        ],
											        'filterValues':'documentType,1'
											     }" 
											/>
							                <input type="checkbox" name="cbxInheritSecurity" id="cbxInheritSecurity" value="true">Inherit security from parent folder<br>
							            </div>
							            <div class="col-sm-4">							                
											<input
											    type="zoom"
											    id = "txtGroupCode"
											    name="txtGroupCode"
											    placeholder="Select group"
											    data-zoom="{
											        'displayKey':'groupId',
											        'datasetId':'group',
											        'fields':[
											            {
											               'field':'groupId',
											               'label':'Código',
											              'standard':'true'
											            },{
											              'field':'groupDescription',
											              'label':'Descrição'
											            }
											        ]
											     }" 
											/>
							            </div>							            
							    </div>
							</div>
			            </div>
			        </div>
			    </div>
			  </div>		
		</form>
	</div>
</body>
</html>
