help.text1=Essa widget \u00E9 um EXEMPLO de um Wizard de Instala\u00E7\u00E3o de Datasets para um app/componente da fluig Store.
help.text2=Sempre que um app da fluig Store necessitar de datasets para persistir algum dado, \u00E9 necess\u00E1rio que esses datasets j\u00E1 estejam dispon\u00EDveis no fluig. Para isso, \u00E9 recomendando que todo app possua um wizard inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o, onde esses datasets s\u00E3o previamente criados antes mesmo que o app seja utilizado pela primeira vez. Lembrando que esses s\u00E3o datasets customizados e os dados s\u00E3o apenas para consulta. Caso deseje atualizar esses dados, o ideal \u00E9 remover o dataset e recri\u00E1-los com os dados atualizados.
help.text3=Nesse wizard, s\u00E3o criados os seguintes datasets com seus respectivos campos. Al\u00E9m disso, existe a op\u00E7\u00E3o de cri\u00E1-los no modo Sincronizado. Note que apenas os datasets s\u00E3o criados e n\u00E3o os formul\u00E1rios:
help.obs=obs.: Caso for implementar esse wizard, n\u00E3o \u00E9 obrigat\u00F3rio exibir essas informa\u00E7\u00F5es. Apenas informe ao usu\u00E1rio que \u00E9 uma etapa inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o. Fique \u00E0 vontade para criar seu Wizard
