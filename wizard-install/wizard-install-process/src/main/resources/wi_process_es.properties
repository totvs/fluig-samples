help.text1=Essa widget \u00E9 um EXEMPLO de um Wizard de Instala\u00E7\u00E3o de um Processo com Formul\u00E1rio para um app/componente da fluig Store.
help.text2=Sempre que um app da fluig Store necessitar de um processo para seu funcionamento, \u00E9 necess\u00E1rio que esse processo j\u00E1 esteja dispon\u00EDveis no fluig. Para isso, \u00E9 recomendando que todo app possua um wizard inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o, onde esse processo ser\u00E1 criado antes mesmo que o app seja utilizado pela primeira vez.
help.text3=Para a instala\u00E7\u00E3o tanto do formul\u00E1rio quanto do processo, \u00E9 necess\u00E1rio transformar o conte\u00FAdo dos arquivos(html e xml) em Base64 de forma din\u00E2mica. Para isso, \u00E9 utilizado uma biblioteca JS.
help.obs=obs.: Caso for implementar esse wizard, n\u00E3o \u00E9 obrigat\u00F3rio exibir essas informa\u00E7\u00F5es. Apenas informe ao usu\u00E1rio que \u00E9 uma etapa inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o. Fique \u00E0 vontade para criar um Wizard de acordo com o app
