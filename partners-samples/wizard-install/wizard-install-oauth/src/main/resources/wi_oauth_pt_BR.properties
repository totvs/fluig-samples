help.text1=Essa widget \u00E9 um EXEMPLO de um Wizard de Instala\u00E7\u00E3o de um Oauth App para um app/componente da fluig Store.
help.text2=Sempre que um app da fluig Store necessitar de uma integra\u00E7\u00E3o, uma alternativa ser\u00E1 criar um OAuth App
help.text3=Nesse wizard, s\u00E3o criados os seguintes componentes: OAuth Provider, OAuth App. Em seguida, s\u00E3o gerados os tokens, accessToken e tokenSecret para essa integra\u00E7\u00E3o.
help.obs=obs.: Caso for implementar esse wizard, n\u00E3o \u00E9 obrigat\u00F3rio exibir essas informa\u00E7\u00F5es. Apenas informe ao usu\u00E1rio que \u00E9 uma etapa inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o. Fique \u00E0 vontade para criar seu Wizard
