help.text1=Essa widget é um EXEMPLO de um Wizard de Instalação de Formulários para um app/componente da fluig Store.
help.text2=Sempre que um app da fluig Store necessitar de formulários, é necessário que esses forms já estejam disponíveis no fluig. Para isso, é recomendando que todo app possua um wizard inicial de instalação/configuração, onde esses forms são previamente criados antes mesmo que o app seja utilizado pela primeira vez.
help.text3=Nesse wizard, é criado um formulário simples.
help.obs=obs.: Caso for implementar esse wizard, não é obrigatório exibir essas informações. Apenas informe ao usuário que é uma etapa inicial de instalação/configuração. Fique à vontade para criar seu Wizard
