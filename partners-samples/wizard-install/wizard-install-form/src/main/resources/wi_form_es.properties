help.text1=Essa widget \u00E9 um EXEMPLO de um Wizard de Instala\u00E7\u00E3o de Formul\u00E1rios para um app/componente da fluig Store.
help.text2=Sempre que um app da fluig Store necessitar de formul\u00E1rios, \u00E9 necess\u00E1rio que esses forms j\u00E1 estejam dispon\u00EDveis no fluig. Para isso, \u00E9 recomendando que todo app possua um wizard inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o, onde esses forms s\u00E3o previamente criados antes mesmo que o app seja utilizado pela primeira vez.
help.text3=Nesse wizard, \u00E9 criado um formul\u00E1rio simples.
help.obs=obs.: Caso for implementar esse wizard, n\u00E3o \u00E9 obrigat\u00F3rio exibir essas informa\u00E7\u00F5es. Apenas informe ao usu\u00E1rio que \u00E9 uma etapa inicial de instala\u00E7\u00E3o/configura\u00E7\u00E3o. Fique \u00E0 vontade para criar um Wizard de acordo com o app
